<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title th:text="#{confirmation.title}">Order Submitted</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
    <style>
        .success-box {
            text-align: center;
            padding: 30px;
            margin-bottom: 30px;
            background: linear-gradient(135deg, #5a3e1b 0%, #8b6914 100%);
            color: #fef7e0;
            border-radius: 12px;
            border: 1px solid #daa520;
            animation: fadeInScale 0.5s ease-out;
        }

        @keyframes fadeInScale {
            0% {
                opacity: 0;
                transform: scale(0.9);
            }
            100% {
                opacity: 1;
                transform: scale(1);
            }
        }

        #confettiCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 9999;
        }

        .section {
            width: 100%;
            max-width: 600px;
            margin: 20px auto;
            box-sizing: border-box;
        }
    </style>
</head>
<body>

<canvas id="confettiCanvas"></canvas>

<div style="max-width: 600px; margin: 0 auto; padding: 20px;">
    <div class="success-box">
        <h2 th:text="#{confirmation.message}">Order Submitted</h2>
        <p th:text="${confirmationMsg}">Your order was successfully submitted!</p>
    </div>

    <div class="section">
        <h3>Order Details</h3>
        <p><strong th:text="#{confirmation.order_number} + ':'">Order Number :</strong> <span th:text="${orderNumber}"></span></p>
        <p><strong th:text="#{confirmation.date_time} + ':'">Date & Time :</strong> <span th:text="${dateTime}"></span></p>
        <p><strong th:text="#{confirmation.summary} + ':'">Issue Summary :</strong> <span th:text="${issueSummary}"></span></p>
        <p><strong th:text="#{confirmation.email} + ':'">Email :</strong> <span th:text="${email}"></span></p>
        <p th:text="#{confirmation.spam}" style="font-size: 12px; color: #8b6914; margin-top: 10px;"></p>
    </div>

    <div th:if="${originalText != null and originalText != ''}" class="section">
        <h3>Customer Comments</h3>
        <p><strong>Original Comments :</strong></p>
        <p style="background: #fff8f0; padding: 10px; border-radius: 6px; margin-top: 5px;" th:text="${originalText}"></p>
        <p th:if="${translatedText != null and translatedText != ''}">
            <strong>Translated Comments :</strong>
        </p>
        <p th:if="${translatedText != null and translatedText != ''}" style="background: #e8d5a8; padding: 10px; border-radius: 6px; margin-top: 5px;" th:text="${translatedText}"></p>
    </div>

    <div class="button-group" style="margin-top: 30px;">
        <form action="/home" method="get">
            <button type="submit" class="home-btn" th:text="#{button.home}">Return Home</button>
        </form>
    </div>
</div>

<script>
    (function() {
        const canvas = document.getElementById('confettiCanvas');
        const ctx = canvas.getContext('2d');

        let width, height;

        function resizeCanvas() {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width;
            canvas.height = height;
            console.log('Canvas size:', width, 'x', height);
        }

        const particles = [];
        const PARTICLE_COUNT = 350;

        function random(min, max) {
            return Math.random() * (max - min) + min;
        }

        class ConfettiParticle {
            constructor() {
                // X position - spread across FULL width
                this.x = random(0, window.innerWidth);
                // Start above the visible area
                this.y = random(-200, -20);
                this.size = random(6, 14);
                this.speedY = random(3, 9);
                this.speedX = random(-2.5, 2.5);
                // Colors - gold, bronze, copper tones
                const colors = ['#DAA520', '#B8860B', '#CD7F32', '#FFD700', '#C5A35A', '#E8B84B'];
                this.color = colors[Math.floor(Math.random() * colors.length)];
                this.rotation = random(0, 360);
                this.rotationSpeed = random(-8, 8);
            }

            update() {
                this.y += this.speedY;
                this.x += this.speedX;
                this.rotation += this.rotationSpeed;

                // Reset when off screen
                if (this.y > height + 100) {
                    this.y = random(-150, -30);
                    this.x = random(0, width);
                }

                // Wrap horizontally
                if (this.x > width + 50) {
                    this.x = -50;
                }
                if (this.x < -50) {
                    this.x = width + 50;
                }
            }

            draw() {
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate(this.rotation * Math.PI / 180);
                ctx.fillStyle = this.color;
                ctx.fillRect(-this.size/2, -this.size/3, this.size, this.size * 0.7);
                ctx.restore();
            }
        }

        let animationId;

        function initConfetti() {
            resizeCanvas();

            // Create particles
            for (let i = 0; i < PARTICLE_COUNT; i++) {
                particles.push(new ConfettiParticle());
            }

            function animate() {
                ctx.clearRect(0, 0, width, height);
                for (let particle of particles) {
                    particle.update();
                    particle.draw();
                }
                animationId = requestAnimationFrame(animate);
            }

            animate();

            // Stop after 5 seconds
            setTimeout(() => {
                cancelAnimationFrame(animationId);
                canvas.style.display = 'none';
            }, 5000);
        }

        window.addEventListener('resize', () => {
            resizeCanvas();
            // Reposition particles on resize
            for (let particle of particles) {
                particle.x = random(0, width);
                particle.y = random(-200, -20);
            }
        });

        // Start when page loads
        window.addEventListener('load', initConfetti);
    })();
</script>

</body>
</html>
