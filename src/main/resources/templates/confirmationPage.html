<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title th:text="#{confirmation.title}">Order Submitted</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
    <style>
        .success-box {
            text-align: center;
            padding: 30px;
            margin-bottom: 30px;
            background: linear-gradient(135deg, #5a3e1b 0%, #8b6914 100%);
            color: #fef7e0;
            border-radius: 12px;
            border: 1px solid #daa520;
            animation: fadeInScale 0.5s ease-out;
        }

        @keyframes fadeInScale {
            0% {
                opacity: 0;
                transform: scale(0.9);
            }
            100% {
                opacity: 1;
                transform: scale(1);
            }
        }

        #confettiCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 9999;
        }

        .section {
            width: 100%;
            max-width: 600px;
            margin: 20px auto;
            box-sizing: border-box;
        }
    </style>
</head>
<body>

<canvas id="confettiCanvas"></canvas>

<div style="max-width: 600px; margin: 0 auto; padding: 20px;">
    <div class="success-box">
        <h2 th:text="#{confirmation.message}">Order Submitted</h2>
        <p th:text="${confirmationMsg}">Your order was successfully submitted!</p>
    </div>

    <div class="section">
        <h3>Order Details</h3>
        <p><strong th:text="#{confirmation.order_number} + ':'">Order Number :</strong> <span th:text="${orderNumber}"></span></p>
        <p><strong th:text="#{confirmation.date_time} + ':'">Date & Time :</strong> <span th:text="${dateTime}"></span></p>
        <p><strong th:text="#{confirmation.summary} + ':'">Issue Summary :</strong> <span th:text="${issueSummary}"></span></p>
        <p><strong th:text="#{confirmation.email} + ':'">Email :</strong> <span th:text="${email}"></span></p>
        <p th:text="#{confirmation.spam}" style="font-size: 12px; color: #8b6914; margin-top: 10px;"></p>
    </div>

    <div th:if="${originalText != null and originalText != ''}" class="section">
        <h3>Customer Comments</h3>
        <p><strong>Original Comments :</strong></p>
        <p style="background: #fff8f0; padding: 10px; border-radius: 6px; margin-top: 5px;" th:text="${originalText}"></p>
        <p th:if="${translatedText != null and translatedText != ''}">
            <strong>Translated Comments :</strong>
        </p>
        <p th:if="${translatedText != null and translatedText != ''}" style="background: #e8d5a8; padding: 10px; border-radius: 6px; margin-top: 5px;" th:text="${translatedText}"></p>
    </div>

    <div class="button-group" style="margin-top: 30px;">
        <form action="/home" method="get">
            <button type="submit" class="home-btn" th:text="#{button.home}">Return Home</button>
        </form>
    </div>
</div>

<script>
    var canvas = document.getElementById('confettiCanvas');
    var ctx = canvas.getContext('2d');

    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    var particles = [];
    var particleCount = 350;
    var colors = ['#DAA520', '#B8860B', '#CD7F32', '#FFD700', '#C5A35A', '#E8B84B', '#8B6914'];

    function random(min, max) {
        return Math.random() * (max - min) + min;
    }

    // Full width - spawn across entire browser width
    for (var i = 0; i < particleCount; i++) {
        particles.push({
            x: random(0, canvas.width),
            y: random(-200, -20),
            size: random(5, 12),
            speedY: random(2, 8),
            speedX: random(-2, 2),
            color: colors[Math.floor(Math.random() * colors.length)],
            rotation: random(0, 360),
            rotationSpeed: random(-5, 5)
        });
    }

    function drawConfetti() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        for (var i = 0; i < particles.length; i++) {
            var p = particles[i];

            p.y += p.speedY;
            p.x += p.speedX;
            p.rotation += p.rotationSpeed;

            if (p.y > canvas.height + 100) {
                p.y = random(-150, -30);
                p.x = random(0, canvas.width);
            }

            if (p.x > canvas.width + 50) p.x = -50;
            if (p.x < -50) p.x = canvas.width + 50;

            ctx.save();
            ctx.translate(p.x, p.y);
            ctx.rotate(p.rotation * Math.PI / 180);
            ctx.fillStyle = p.color;
            ctx.fillRect(-p.size/2, -p.size/3, p.size, p.size * 0.6);
            ctx.restore();
        }

        requestAnimationFrame(drawConfetti);
    }

    window.addEventListener('resize', function() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        for (var i = 0; i < particles.length; i++) {
            particles[i].x = random(0, canvas.width);
            particles[i].y = random(-200, -20);
        }
    });

    drawConfetti();

    setTimeout(function() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        canvas.style.display = 'none';
    }, 5000);
</script>

</body>
</html>
