<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Service Writer Login</title>
  <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>

<h3>CSCD488 Project</h3>
<h4>Team #4: Aaron Oehler, Derik Little, Danish Wahidi</h4>
<hr>

<div class="login-container">
  <h2>Service Writer Login</h2>

  <p class="login-description">
    Please log in to access the service writer dashboard.
  </p>

  <div th:if="${error}" class="error-box">
    <p th:text="${error}">Invalid username or password.</p>
  </div>

  <form th:action="@{/service-writer/login}" method="post">
    <div class="form-group">
      <label for="username">Username:</label>
      <input type="text" name="username" id="username" required>
    </div>

    <div class="form-group">
      <label for="password">Password:</label>
      <input type="password" name="password" id="password" required>
    </div>

    <div class="button-group">
      <button type="submit" class="next-btn">Login</button>
    </div>
  </form>

  <div class="button-group" style="margin-top: 15px;">
    <a th:href="@{/home}">
      <button type="button" class="back-btn">Back to Customer Page</button>
    </a>
  </div>
</div>

</body>
</html>
