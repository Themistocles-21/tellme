<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title th:text="#{customer.title}">Customer Information</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>

<div style="position: relative; width: 100%; max-width: 600px; margin: 0 auto;">
    <div style="position: absolute; top: 5px; right: 5px;">
        <a th:href="@{/service-writer}">
            <button type="button" style="font-size: 10px; padding: 3px 10px; background-color: #8b6914; color: #fef7e0; border: 1px solid #daa520; border-radius: 12px; cursor: pointer; font-family: 'Georgia', 'Times New Roman', serif;">Login</button>
        </a>
    </div>

    <h3>CSCD488 Project</h3>
    <h4>Team #4: Aaron Oehler, Derik Little, Danish Wahidi</h4>
    <hr>

    <div class="progress-container">
        <div class="progress-steps">
            <div class="step current">
                <div class="step-circle"><span>1</span></div>
                <div class="step-label" th:text="#{step.customer}">Customer</div>
                <div class="progress-line"></div>
            </div>
            <div class="step pending">
                <div class="step-circle"><span>2</span></div>
                <div class="step-label" th:text="#{step.vehicle}">Vehicle</div>
                <div class="progress-line"></div>
            </div>
            <div class="step pending">
                <div class="step-circle"><span>3</span></div>
                <div class="step-label" th:text="#{step.location}">Location</div>
                <div class="progress-line"></div>
            </div>
            <div class="step pending">
                <div class="step-circle"><span>4</span></div>
                <div class="step-label" th:text="#{step.issue_type}">Issue Type</div>
                <div class="progress-line"></div>
            </div>
            <div class="step pending">
                <div class="step-circle"><span>5</span></div>
                <div class="step-label" th:text="#{step.severity}">Severity</div>
                <div class="progress-line"></div>
            </div>
            <div class="step pending">
                <div class="step-circle"><span>6</span></div>
                <div class="step-label" th:text="#{step.comments}">Comments</div>
                <div class="progress-line"></div>
            </div>
            <div class="step pending">
                <div class="step-circle"><span>7</span></div>
                <div class="step-label" th:text="#{step.review}">Review</div>
                <div class="progress-line"></div>
            </div>
        </div>
    </div>
    <hr>

    <div class="language-buttons">
        <form action="/language" method="post" style="display: inline;">
            <input type="hidden" name="lang" value="en">
            <button type="submit" class="lang-btn">English</button>
        </form>
        <form th:if="${!#strings.contains(disabledServices, 'lang_fa')}" action="/language" method="post" style="display: inline;">
            <input type="hidden" name="lang" value="fa">
            <button type="submit" class="lang-btn">فارسی</button>
        </form>
        <form th:if="${!#strings.contains(disabledServices, 'lang_ru')}" action="/language" method="post" style="display: inline;">
            <input type="hidden" name="lang" value="ru">
            <button type="submit" class="lang-btn">Русский</button>
        </form>
    </div>

    <form action="/register" method="post" id="customerForm">
        <input type="hidden" name="language" id="language" value="en">

        <div class="form-group">
            <label for="fname">First Name :</label>
            <input type="text" name="fname" id="fname" required/>
        </div>

        <div class="form-group">
            <label for="lname">Last Name :</label>
            <input type="text" name="lname" id="lname" required/>
        </div>

        <div class="form-group">
            <label for="email">Email :</label>
            <input type="email" name="email" id="email" placeholder="email@example.com" required/>
        </div>

        <div class="form-group">
            <label for="phone">Phone :</label>
            <input type="text" name="phone" id="phone" placeholder="(555) 555-5555" required/>
        </div>

        <div class="form-group">
            <label for="address">Address :</label>
            <input type="text" name="address" id="address" placeholder="123 Main St, City, ST 12345" required/>
        </div>

        <div class="form-group">
            <label for="companyName">Company Name :</label>
            <input type="text" name="companyName" id="companyName" placeholder="optional"/>
        </div>

        <div class="button-group">
            <button type="submit" class="next-btn" th:text="#{button.next}">Next</button>
        </div>
    </form>
</div>

<script>
    function setLanguage(lang) {
        document.getElementById('language').value = lang;
    }
</script>

</body>
</html>
