<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Work Orders</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
    <style>
        .orders-container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }
        .order-table {
            width: 100%;
            border-collapse: collapse;
            background: #fef5e6;
        }
        .order-table th, .order-table td {
            padding: 12px;
            border: 1px solid #c9a87b;
            text-align: left;
        }
        .order-table th {
            background-color: #e8d5a8;
            font-weight: bold;
        }
        .order-table tr:hover {
            background-color: #fef0d6;
        }
        .status-pending {
            color: #8b6914;
            font-weight: bold;
        }
        .status-in-progress {
            color: #b8860b;
            font-weight: bold;
        }
        .status-completed {
            color: #5a3e1b;
            font-weight: bold;
        }
        .status-cancelled {
            color: #8b4513;
            font-weight: bold;
        }
        .edit-btn {
            padding: 5px 12px;
            background-color: #8b6914;
            color: #fef7e0;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
        }
        .edit-btn:hover {
            background-color: #5a3e1b;
        }
        .header-actions {
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
        }
        @media (max-width: 768px) {
            .order-table {
                display: block;
                overflow-x: auto;
            }
        }
    </style>
</head>
<body>

<h3>CSCD488 Project</h3>
<h4>Team #4: Aaron Oehler, Derik Little, Danish Wahidi</h4>
<hr>

<div class="orders-container">
    <div class="header-actions">
        <h2>Work Orders</h2>
        <a th:href="@{/service-writer/dashboard}" class="edit-btn" style="background-color: #6b4c1a;">Back to Dashboard</a>
    </div>

    <table class="order-table">
        <thead>
        <tr>
            <th>Order ID</th>
            <th>Customer</th>
            <th>Vehicle</th>
            <th>Issue</th>
            <th>Severity</th>
            <th>Status</th>
            <th>Action</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="vehicle : ${vehicles}">
            <td th:text="${vehicle.id}">1</td>
            <td th:text="${vehicle.customer.fname} + ' ' + ${vehicle.customer.lname}">Customer Name</td>
            <td th:text="${vehicle.year} + ' ' + ${vehicle.make} + ' ' + ${vehicle.model}">Vehicle</td>
            <td th:text="${vehicle.issueLocation} + ' - ' + ${vehicle.issueType}">Issue</td>
            <td th:text="${vehicle.severity}">Severity</td>
            <td>
                    <span th:class="${'status-' + vehicle.status.toLowerCase().replace(' ', '-')}"
                          th:text="${vehicle.status}">Pending</span>
            </td>
            <td>
                <a th:href="@{/service-writer/order/{id}(id=${vehicle.id})}" class="edit-btn">Edit</a>
            </td>
        </tr>
        <tr th:if="${vehicles.empty}">
            <td colspan="7" style="text-align: center;">No work orders found.</td>
        </tr>
        </tbody>
    </table>
</div>

</body>
</html>
